name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        framework: [net8.0, net10.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # Install both SDKs so the net8.0 target can be built and tested
          # on a net10.0 SDK host without falling back to runtime-only.
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore
      # The .NET test host hangs on Linux after the run completes; --blame-hang kills it and
      # reports exit code 1 regardless of the results. continue-on-error keeps that shutdown
      # hang from blocking PRs, so the trx gate below — not the exit code — decides the job.
      - name: Test (${{ matrix.framework }})
        run: dotnet test tests/KernSmith.Tests/KernSmith.Tests.csproj --no-build -f ${{ matrix.framework }} --verbosity normal --blame-hang --blame-hang-timeout 3m --logger "trx;LogFileName=core.trx" --results-directory testresults
        continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
      - name: Test rasterizers (${{ matrix.framework }})
        run: dotnet test tests/KernSmith.Rasterizers.Native.Tests/KernSmith.Rasterizers.Native.Tests.csproj --no-build -f ${{ matrix.framework }} --verbosity normal --blame-hang --blame-hang-timeout 3m --logger "trx;LogFileName=rasterizers.trx" --results-directory testresults
        continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
      # KernSmith.Ui targets net10.0 only, so this project cannot be tested on the net8.0 leg.
      - name: Test UI services
        if: matrix.framework == 'net10.0'
        run: dotnet test tests/KernSmith.Ui.Tests/KernSmith.Ui.Tests.csproj --no-build -f net10.0 --verbosity normal --blame-hang --blame-hang-timeout 3m --logger "trx;LogFileName=ui.trx" --results-directory testresults
        continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
      - name: Verify test results
        if: always()
        shell: bash
        run: |
          # Gate on the recorded results rather than the runner's exit code: Ubuntu masks its
          # exit code for the shutdown hang, which would otherwise let real failures through.
          shopt -s nullglob
          files=(testresults/*.trx)
          expected=2
          if [ "${{ matrix.framework }}" = "net10.0" ]; then expected=3; fi
          status=0
          if [ "${#files[@]}" -ne "$expected" ]; then
            echo "::error::Expected $expected result file(s) in testresults/, found ${#files[@]} — a test project did not report."
            status=1
          fi
          for f in "${files[@]}"; do
            # || true throughout: a missing match makes grep exit 1, which pipefail would
            # otherwise turn into a step crash before the diagnostics below can run.
            counters=$(grep -o '<Counters [^>]*>' "$f" | head -1 || true)
            total=$(printf '%s' "$counters" | grep -o 'total="[0-9]*"' | tr -dc '0-9' || true)
            failed=$(printf '%s' "$counters" | grep -o 'failed="[0-9]*"' | tr -dc '0-9' || true)
            if [ -z "$total" ] || [ -z "$failed" ]; then
              echo "::error::$f has no result counters — the run did not complete."
              status=1
              continue
            fi
            echo "$f: total=$total failed=$failed"
            if [ "$total" -eq 0 ]; then
              echo "::error::$f ran zero tests."
              status=1
            fi
            if [ "$failed" -ne 0 ]; then
              echo "::error::$failed test(s) failed in $f."
              status=1
            fi
          done
          exit $status

  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - name: Verify formatting (dotnet format)
        run: dotnet format KernSmith.sln --verify-no-changes
      - name: Scan for vulnerable NuGet packages
        run: |
          dotnet list KernSmith.sln package --vulnerable --include-transitive 2>&1 | tee vuln.log
          if grep -q "has the following vulnerable packages" vuln.log; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi
          echo "No vulnerable packages found"
      - name: Verify release version is cleanly parseable
        run: |
          # Mirror the version extraction used by publish.yml's validate job so a
          # malformed <Version> — or a comment that contains the literal token —
          # is caught here on every PR/push instead of only at release time.
          version=$(grep -oP '<Version>\K[^<]+(?=</Version>)' Directory.Build.props)
          count=$(printf '%s\n' "$version" | grep -c .)
          if [ "$count" -ne 1 ]; then
            echo "::error::Directory.Build.props must contain exactly one <Version>...</Version>; extraction returned: $version"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -qP '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Directory.Build.props version is not valid SemVer: '$version'"
            exit 1
          fi
          echo "Release version OK: $version"

  wasm-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools
      - name: Publish Blazor WASM sample
        run: dotnet publish samples/KernSmith.Samples.BlazorWasm/KernSmith.Samples.BlazorWasm.csproj -c Release
      - name: Verify no native binaries in output
        run: |
          WASM_DIR=$(find . -path "*/bin/Release/*/publish/wwwroot/_framework" -type d | head -1)
          if [ -z "$WASM_DIR" ]; then
            echo "::error::WASM publish output not found"
            exit 1
          fi
          echo "WASM framework files:"
          ls -la "$WASM_DIR"
          if ls "$WASM_DIR"/*.so 2>/dev/null || ls "$WASM_DIR"/libfreetype* 2>/dev/null; then
            echo "::error::Native binaries found in WASM output"
            exit 1
          fi
          echo "No native binaries found — WASM output is clean"
